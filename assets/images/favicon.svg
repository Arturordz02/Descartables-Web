<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="terracotaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D96B43"/>
      <stop offset="100%" stop-color="#B84A22"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Base redondeada color terracota -->
  <rect width="64" height="64" rx="16" fill="url(#terracotaGrad)"/>

  <!-- Sombra interna sutil -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Isotipo de empaque eco-amigable -->
  <!-- Tapa del envase -->
  <path d="M14 24 C14 22, 16 20, 19 20 L45 20 C48 20, 50 22, 50 24 L48 27 L16 27 Z" fill="#FFFFFF" fill-opacity="0.95"/>
  
  <!-- Cuerpo del envase / bowl kraft -->
  <path d="M16 29 L20 45 C20.8 48, 23 49.5, 26 49.5 L38 49.5 C41 49.5, 43.2 48, 44 45 L48 29 Z" fill="#FDFBF7"/>

  <!-- Pliegue / textura de empaque -->
  <path d="M25 32 L26.5 45 M32 32 L32 45 M39 32 L37.5 45" stroke="#EAE3DA" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Hoja ecológica que brota del empaque (símbolo biodegradable) -->
  <path d="M42 13 C49 13, 53 17, 52 23 C45 24, 41 20, 42 13 Z" fill="url(#leafGrad)"/>
  <path d="M42 22 C45 19, 48 16, 52 14" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none"/>
</svg>
